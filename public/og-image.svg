<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF5F9"/>
      <stop offset="50%" stop-color="#F0F7FF"/>
      <stop offset="100%" stop-color="#E8F1FF"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F5A3C0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- Soft clouds -->
  <g fill="#FFFFFF" opacity="0.85">
    <ellipse cx="180" cy="140" rx="80" ry="26"/>
    <ellipse cx="240" cy="120" rx="60" ry="22"/>
    <ellipse cx="980" cy="180" rx="90" ry="28"/>
    <ellipse cx="1050" cy="160" rx="55" ry="20"/>
  </g>

  <!-- House silhouette -->
  <g transform="translate(420 240)">
    <polygon points="180,0 360,140 0,140" fill="#E8729A"/>
    <rect x="30" y="140" width="300" height="180" fill="url(#house)"/>
    <rect x="140" y="210" width="80" height="110" fill="#4A90D9" rx="6"/>
    <circle cx="180" cy="270" r="4" fill="#FFF"/>
    <rect x="60" y="170" width="50" height="50" fill="#FFF" rx="4"/>
    <rect x="250" y="170" width="50" height="50" fill="#FFF" rx="4"/>
    <!-- chimney smoke -->
    <g fill="#FFFFFF" opacity="0.9">
      <circle cx="300" cy="-20" r="14"/>
      <circle cx="320" cy="-50" r="11"/>
      <circle cx="305" cy="-80" r="9"/>
    </g>
  </g>

  <!-- Title -->
  <g font-family="'Baloo 2', system-ui, sans-serif" text-anchor="middle">
    <text x="600" y="500" font-size="96" font-weight="800" fill="#2C5F9E">The Cozy Trio</text>
    <text x="600" y="560" font-size="34" font-weight="600" fill="#C44D78">
      A Danish-Filipino love story, one tiny chapter at a time
    </text>
  </g>

  <!-- Flags -->
  <g transform="translate(540 590)">
    <!-- Danish flag -->
    <rect width="48" height="32" fill="#C8102E"/>
    <rect x="14" width="6" height="32" fill="#FFF"/>
    <rect y="13" width="48" height="6" fill="#FFF"/>
  </g>
  <g transform="translate(612 590)">
    <!-- Filipino flag (simplified) -->
    <rect width="48" height="16" fill="#0038A8"/>
    <rect y="16" width="48" height="16" fill="#CE1126"/>
    <polygon points="0,0 20,16 0,32" fill="#FFFFFF"/>
    <circle cx="7" cy="16" r="2.5" fill="#FCD116"/>
  </g>
</svg>
