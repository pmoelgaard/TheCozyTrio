<main class="smoke">
  <h1 class="smoke__title">The Cozy Trio</h1>
  <p class="smoke__sub">
    A Danish–Filipino love story, one tiny chapter at a time.
  </p>

  <div class="smoke__toggle">
    <cozy-theme-toggle />
  </div>

  <section class="smoke__swatches" aria-label="Theme swatches">
    <div class="swatch swatch--brand">brand</div>
    <div class="swatch swatch--hover">hover</div>
    <div class="swatch swatch--accent">accent</div>
    <div class="swatch swatch--surface">surface</div>
  </section>

  <p class="smoke__status">
    Active theme: <strong>{{ theme.theme() }}</strong>
    &middot; Color scheme: <strong>{{ theme.resolvedColorScheme() }}</strong>
  </p>
</main>
