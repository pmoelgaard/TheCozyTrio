<xs-card class="mom-card" variant="elevated" (click)="onClick()">
  <div slot="image" class="mom-card__image">
    <svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- Background circle -->
      <circle cx="100" cy="90" r="80" fill="var(--color-surface-secondary)" />
      <!-- Hair back -->
      <path d="M40 80 Q40 30 100 25 Q160 30 160 80 L160 160 L40 160 Z" fill="#1a1a1a" />
      <!-- Face -->
      <circle class="mom-card__face" cx="100" cy="85" r="32" fill="#f5c9a8" />
      <!-- Hair front -->
      <path d="M68 65 Q70 45 100 42 Q130 45 132 65 Q120 58 100 60 Q80 58 68 65 Z" fill="#1a1a1a" />
      <!-- Eyes -->
      <circle cx="90" cy="85" r="2.5" fill="#1a1a1a" />
      <circle cx="110" cy="85" r="2.5" fill="#1a1a1a" />
      <!-- Lashes -->
      <path d="M86 80 L88 78 M94 80 L92 78 M106 80 L108 78 M114 80 L112 78"
            stroke="#1a1a1a" stroke-width="1" stroke-linecap="round" />
      <!-- Lips -->
      <path d="M94 100 Q100 105 106 100" stroke="#e8729a" stroke-width="2"
            fill="none" stroke-linecap="round" />
      <!-- Body -->
      <rect x="65" y="118" width="70" height="50" rx="8" fill="var(--color-action-default)" />
      <!-- Microphone held in hand -->
      <g class="mom-card__mic">
        <circle cx="155" cy="118" r="8" fill="#666" />
        <rect x="152" y="120" width="6" height="20" fill="#333" />
      </g>
      <!-- Music notes (appear on hover) -->
      <g class="mom-card__notes" aria-hidden="true">
        <text x="170" y="90" font-size="18">♪</text>
        <text x="185" y="70" font-size="14">♫</text>
        <text x="25" y="80" font-size="16">♪</text>
      </g>
    </svg>
  </div>
  <div slot="heading" class="mom-card__heading">
    <h3>Filipino Mom</h3>
    <span class="mom-card__flag" aria-hidden="true">🇵🇭</span>
  </div>
  <div slot="body" class="mom-card__body">
    <p>
      Queen of adobo, expert cuddler, and the one who makes every room
      feel like home. Warm like a Manila afternoon.
    </p>
  </div>
  <div slot="footer" class="mom-card__footer">
    <span class="mom-card__hint">psst — try clicking me</span>
  </div>
</xs-card>
